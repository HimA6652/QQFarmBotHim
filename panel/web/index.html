<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ农场助手 · 控制面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="dot" id="healthDot"></span>
      <h1>QQ农场助手</h1>
      <span class="tag" id="versionTag">控制面板</span>
    </div>
    <div class="meta" id="hostMeta">正在连接…</div>
  </header>

  <section class="grid">

    <article class="card" id="cardFarm">
      <div class="card-head">
        <div>
          <h2>主程序</h2>
          <p class="sub">农场网关连接 · 账号调度 · 活动任务</p>
        </div>
        <span class="badge" id="farmBadge">读取中</span>
      </div>
      <dl class="kv">
        <div><dt>端口</dt><dd>3007</dd></div>
        <div><dt>PID</dt><dd id="farmPid">—</dd></div>
        <div><dt>已运行</dt><dd id="farmUptime">—</dd></div>
      </dl>
      <div class="actions">
        <button class="btn primary" data-act="farm-start">启动</button>
        <button class="btn" data-act="farm-restart">重启</button>
        <button class="btn danger" data-act="farm-stop">停止</button>
        <a class="btn link" id="farmLink" href="#" target="_blank" rel="noopener">打开主界面</a>
      </div>
    </article>

    <article class="card" id="cardNapcat">
      <div class="card-head">
        <div>
          <h2>NapCat 协议端</h2>
          <p class="sub">QQ 登录 / 扫码取码 · 仅本机监听</p>
        </div>
        <span class="badge" id="napcatBadge">读取中</span>
      </div>
      <dl class="kv">
        <div><dt>WebUI</dt><dd id="napcatPort">6099</dd></div>
        <div><dt>PID</dt><dd id="napcatPid">—</dd></div>
        <div><dt>已运行</dt><dd id="napcatUptime">—</dd></div>
      </dl>
      <div class="actions">
        <button class="btn primary" data-act="napcat-start">启动</button>
        <button class="btn danger" data-act="napcat-stop">停止</button>
        <button class="btn ghost" id="copyToken" disabled>复制本机令牌</button>
      </div>
      <p class="hint" id="tokenHint">令牌仅在本机访问时显示。</p>
    </article>

    <article class="card" id="cardAccounts">
      <div class="card-head">
        <div>
          <h2>账号</h2>
          <p class="sub">登录状态请在主界面查看</p>
        </div>
        <span class="badge neutral" id="accountBadge">0 个</span>
      </div>
      <ul class="accounts" id="accountList">
        <li class="empty">暂无账号</li>
      </ul>
    </article>

  </section>

  <section class="card logs">
    <div class="card-head">
      <div>
        <h2>运行日志</h2>
        <p class="sub" id="logFile">—</p>
      </div>
      <div class="tabs" id="logTabs">
        <button class="tab active" data-source="panel">面板</button>
        <button class="tab" data-source="core">主程序</button>
        <button class="tab" data-source="napcat">NapCat</button>
      </div>
    </div>
    <div class="logfilters" id="logFilters" hidden></div>
    <pre class="logbox" id="logBox">加载中…</pre>
    <div class="logbox loglist" id="logList" hidden></div>
  </section>

  <footer class="foot">
    <span id="footInfo">局域网内可直接访问本页；NapCat 端口未对外开放。</span>
    <button class="btn ghost small" id="stopPanel">关闭面板服务</button>
  </footer>

</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
